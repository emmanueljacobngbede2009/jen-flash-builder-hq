<!DOCTYPE html>
<html>
<head>
<title>JEN FLASH BUILDER - Sign Up</title>
<style>
body {background:black; color:white; font-family:sans-serif; text-align:center; padding-top:50px;}
input {width:80%; padding:12px; margin:10px; border-radius:8px; border:none;}
button {padding:12px 30px; background:#00FF88; color:black; border:none; border-radius:8px; font-weight:bold; font-size:16px;}
</style>
</head>
<body>
<h1>JEN FLASH BUILDER</h1>
<p>Sign up in 2 seconds</p>
<input type="email" placeholder="Enter Email" id="email">
<input type="tel" placeholder="Enter Phone" id="phone">
<button onclick="signup()">Sign Up</button>

<script>
function signup(){
  localStorage.setItem('user', document.getElementById('email').value);
  window.location.href = "app.html";
}
</script>
</body>
</html>
