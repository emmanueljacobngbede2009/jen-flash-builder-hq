<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEN FLASH BUILDER - GOD MODE</title>
<style>
body{margin:0;background:#000;color:#FFD700;font-family:Arial;display:flex;flex-direction:column;height:100vh}
#top{padding:15px;border-bottom:3px solid #FFD700;display:flex;gap:10px}
input{flex:1;padding:15px;border-radius:10px;border:2px solid #FFD700;background:#111;color:#fff;font-size:16px}
button{padding:15px 20px;background:#FFD700;color:#000;font-weight:bold;border:none;border-radius:10px}
#main{flex:1;display:flex}
#left{width:50%;padding:15px;border-right:2px solid #333}
#right{width:50%;background:#fff}
iframe{width:100%;height:100%;border:none}
#log{color:#0f0;background:#111;padding:10px;height:100px;overflow:auto;margin-top:10px;border-radius:10px;font-size:12px}
</style></head><body>
<div id="top">
<input id="prompt" placeholder="Build me portfolio / store / business...">
<button onclick="build()">BUILD 2-CLICKS</button>
<button onclick="share()">SHARE TO BILLIONS</button>
</div>
<div id="main">
<div id="left">
<h3>JEN FLASH BUILDER v19 GOD MODE</h3>
<p style="color:#fff">Type what you want to build and tap BUILD</p>
<div id="log">System ready... 4 templates loaded...</div>
</div>
<div id="right"><iframe id="preview"></iframe></div>
</div>
<script>
let templates={
portfolio:'templates/portfolio.html',
store:'templates/store.html',
business:'templates/business.html',
scam:'templates/scam-check.html'
};
function build(){
let p=document.getElementById('prompt').value.toLowerCase();
let log=document.getElementById('log');
log.innerHTML+="<br>> Building: "+p;
let target='portfolio';
if(p.includes('store')||p.includes('shop')||p.includes('sell')) target='store';
else if(p.includes('business')||p.includes('company')) target='business';
else if(p.includes('scam')||p.includes('check')) target='scam';
let url=templates[target];
log.innerHTML+="<br>> Loading "+target+" -> "+url;
document.getElementById('preview').src=url;
log.innerHTML+="<br>> BUILT! Preview ready. Tap SHARE.";
}
function share(){
let url=window.location.href;
if(navigator.share){navigator.share({title:'My JEN App',url:url})}
else{prompt('Copy this link - Share to billions:',url)}
}
build();
</script></body></html>
