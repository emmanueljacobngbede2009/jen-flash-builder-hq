<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEN SCAM CHECK</title><style>body{background:#000;color:#fff;font-family:Arial;padding:12px}input{width:100%;padding:12px;background:#111;color:#fff;border:2px solid red}button{background:red;color:#fff;padding:12px;width:100%;border:none;margin-top:10px;font-weight:bold}</style></head><body><h1 style="color:red">JEN SCAM CHECK</h1><input id="s" placeholder="Paste suspicious link"><button onclick="check()">CHECK NOW</button><p id="r"></p><script>function check(){let v=document.getElementById('s').value.toLowerCase();if(v.includes('free money')||v.includes('giveaway')||v.includes('double your money')||v.includes('crypto double')){document.getElementById('r').innerHTML='DANGER - SCAM';}else{document.getElementById('r').innerHTML='Looks okay but verify on Google';}}</script></body></html>
